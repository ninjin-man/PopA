<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>未知の迷宮 — ローグライク試作</title>
<style>
:root{--bg:#0b1015;--panel:#19232b;--edge:#50616b;--text:#eee7d5;--muted:#9fb0b2;--gold:#f4d17c;--red:#ee7770;--green:#8cdaa5}
*{box-sizing:border-box}body{margin:0;padding:10px;background:radial-gradient(ellipse at top,#26343d,#0b1015 70%);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:1000px;margin:auto;display:grid;gap:9px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-size:clamp(17px,3vw,24px);font-weight:900;letter-spacing:.1em;color:#f4d58c}.brand small{display:block;font-size:10px;color:#a4b6b3;letter-spacing:.2em}
button{font:inherit;color:var(--text);background:linear-gradient(#3a4a55,#202b34);border:1px solid #6b7c84;border-bottom-width:3px;border-radius:7px;padding:9px 11px;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(2px);border-bottom-width:1px}button:disabled{opacity:.4;cursor:default}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#172129;border:1px solid #3d4d56;border-radius:7px;padding:7px 9px}.label{font-size:10px;letter-spacing:.12em;color:#a9b9b8}.value{font-weight:900;font-size:16px}.bar{height:6px;background:#080c10;margin-top:4px;border:1px solid #435058}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9d333d,#f07964)}
.stage{position:relative;overflow:hidden;border:2px solid #52636b;border-radius:9px;background:#090f14;box-shadow:0 8px 25px #0008;isolation:isolate}canvas{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:manipulation}.stagehead{position:absolute;z-index:3;top:7px;left:7px;right:7px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:1px 2px #000}.stage > .hud{position:absolute!important;z-index:4;top:38px;left:7px;right:7px;width:auto;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;pointer-events:none;margin:0}.stage > .hud .stat{background:#101a20e8;padding:4px 5px;border-color:#63747a}.stage > .hud .label{font-size:9px}.stage > .hud .value{font-size:13px}.stage > .hud .bar{height:4px;margin-top:2px}.stagebag{display:none;position:absolute;z-index:4;left:7px;right:7px;bottom:7px;background:#101a20e8;border:1px solid #64747a;border-radius:7px;padding:6px}.stagebag.open{display:block}.stagebag-inner{background:transparent!important;border:0!important;padding:0!important}.stagebag .title{margin:0 0 4px;font-size:10px}.stagebag .slot{min-height:34px;background:#111b22eF}.stagebag .slot .ico{font-size:19px}.stagebag .slot .nm{font-size:9px}.stagebag .hint{display:none}.pill{background:#111b20df;border:1px solid #65767a;padding:4px 7px;border-radius:5px;font-size:10px;font-weight:900}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:9px}.panel{min-width:0;background:linear-gradient(#1d2931,#131b21);border:1px solid #3f5059;border-radius:8px;padding:10px}.title{font-size:11px;letter-spacing:.14em;font-weight:900;color:#bdc9c4;margin-bottom:8px}
.controls{display:grid;grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px);gap:4px;justify-content:center;touch-action:manipulation}.controls button{padding:0;font-size:18px;min-width:0;min-height:0}.controls .centerkey{font-size:11px;background:linear-gradient(#80643b,#44331f);border-color:#c7a25d}.blank{visibility:hidden}.actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}.actions button{font-size:12px;padding:9px 5px}.goldbtn{background:linear-gradient(#85643b,#50391f);border-color:#c7a25d;color:#fff0c4}.danger{background:linear-gradient(#723e42,#3b252a);border-color:#a8676c}
.bag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.slot{position:relative;min-width:0;min-height:58px;background:#0d151b;border:1px solid #4a5b63;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer}.slot .ico{font-size:23px;line-height:1.1}.slot .nm{font-size:9px;color:#cbd4cd;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot .num{position:absolute;right:3px;top:2px;font-size:9px;color:#f3d581}.slot.empty{border-style:dashed;color:#56656a;font-size:10px;cursor:default}.slot.equipped{border-color:#e4c46e;box-shadow:inset 0 0 0 1px #e4c46e}.hint{font-size:11px;color:var(--muted);margin-top:7px;min-height:16px}.log{height:96px;overflow:auto;display:flex;flex-direction:column-reverse;gap:3px;font-size:11px;color:#aebdba}.log div:first-child{color:#f1d58a}.legend{font-size:10px;color:#9fb0b2;margin-top:5px}.modalwrap{position:fixed;inset:0;z-index:10;background:#03070bea;display:none;place-items:center;padding:14px}.modal{width:min(480px,100%);max-height:88vh;overflow:auto;background:linear-gradient(#293740,#121a20);border:2px solid #718187;border-radius:12px;padding:15px;box-shadow:0 20px 70px #000}.modal h2{margin:0 0 6px;font-size:20px;color:#f4d58c}.modal p{margin:5px 0 12px;color:#bdcbc7;font-size:12px}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.modalactions button{font-size:13px}.itembig{display:flex;gap:12px;align-items:center;padding:10px;background:#10181e;border:1px solid #43545b;border-radius:8px;margin:10px 0}.itembig .bigico{font-size:35px;width:48px;text-align:center}.itembig strong{display:block}.itembig small{color:#a7b7b3}.fullitems{display:grid;gap:6px}.choice{display:flex;align-items:center;gap:8px;text-align:left;width:100%;background:#111a20}.choice span:first-child{font-size:23px;width:30px;text-align:center}.choice small{display:block;color:#a4b3b0}.notice{color:#f0d38a;font-size:12px;margin-top:8px}
@media(max-width:640px){body{padding:6px}.layout{grid-template-columns:1fr}.panel{padding:8px}.hud{gap:4px}.stat{padding:6px}.value{font-size:14px}.log{height:66px}.slot{min-height:54px}.stage > .hud{top:35px}.stage > .hud .value{font-size:12px}.stagebag{left:5px;right:5px;bottom:5px;padding:4px}.stagebag .bag{gap:3px}.stagebag .slot{min-height:32px}.stagebag .slot .nm{font-size:8px}}
#bagpanel{display:none}
#bagpanel.inventory-open{display:block}
.layout.inventory-hidden{grid-template-columns:1fr}
.stagehead{z-index:2}
@media(max-width:640px){.hud{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:5px 4px}.label{font-size:9px}.value{font-size:13px}}
</style></head><body><main>
<header class="top"><div class="brand">UNKNOWN DUNGEON<small>CLASSIC ROGUELIKE · BUILD 03</small></div><button id="restart">↻ 最初から</button></header>
<section class="hud" id="hud">
<div class="stat"><div class="label">HP</div><div class="value" id="hptext">14 / 14</div><div class="bar"><i id="hpbar"></i></div></div>
<div class="stat"><div class="label">満腹度</div><div class="value" id="foodtext">100%</div><div class="bar"><i id="foodbar" style="background:#d5b85f"></i></div></div>
<div class="stat"><div class="label">階層</div><div class="value" id="depthtext">B1F</div></div>
<div class="stat"><div class="label">確保資金</div><div class="value" id="goldtext">0 G</div></div>
</section>
<section class="stage"><div class="stagehead"><span class="pill" id="floorlabel">OLD RUINS · B1F</span><span class="pill" id="task">探索して戦利品を確保</span></div><canvas id="game" width="440" height="440" aria-label="ダンジョン画面"></canvas></section>
<div class="layout inventory-hidden" id="layout">
<section class="panel"><div class="title">移動 / ACTION</div><div style="display:flex;gap:12px;align-items:center;justify-content:space-between">
<div class="controls"><button data-move="-1,-1">↖</button><button data-move="0,-1">↑</button><button data-move="1,-1">↗</button><button data-move="-1,0">←</button><button id="wait" class="centerkey" title="足踏み">足踏み</button><button data-move="1,0">→</button><button data-move="-1,1">↙</button><button data-move="0,1">↓</button><button data-move="1,1">↘</button></div>
<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px"><button id="attack">A 攻撃</button><button id="pickup" class="goldbtn">B 持ち物</button><button id="faceEnemy">Y 敵を向く</button><button id="showMap">L 全体マップ</button><button id="escape" class="danger">帰還</button><button id="descend">階段を下りる</button></div>
</div><div class="legend">8方向移動。敵に向かって移動すると攻撃。歩くとHPが1回復。3行動ごとに満腹度-1。道具は空き枠があれば自動取得。</div><div class="actions"><button id="history">B+Y メッセージ履歴</button><button id="menu">X メニュー</button></div></section>
<section class="panel" id="bagpanel"><div class="title">持ち物 — スロットをタップして操作</div><div class="bag" id="bag"></div><div class="hint" id="baghint">アイテムを選ぶと「使う・装備・投げる・置く・捨てる・調べる」が選べます。</div></section>
</div>
<section class="panel"><div class="title">探索ログ</div><div class="log" id="log"></div></section>
</main>
<div class="modalwrap" id="modalwrap"><div class="modal" id="modal"></div></div>
<div class="modalwrap" id="endwrap"><div class="modal"><h2 id="endtitle">探索終了</h2><p id="endtext"></p><button id="continue">拠点から再出発</button></div></div>
<script>
(()=>{
const cv=document.getElementById('game'),c=cv.getContext('2d');const N=11,T=40,CAP=8;
const itemDefs={
 herb:{name:'正体不明の草',icon:'🌿',value:8,kind:'grass',unknown:true,desc:'見た目だけでは効果が分からない草。'},
 scroll:{name:'正体不明の巻物',icon:'📜',value:15,kind:'scroll',unknown:true,desc:'文字がかすれて読めない巻物。'},
 seed:{name:'大きな種',icon:'🟤',value:6,kind:'food',desc:'食べると満腹度が少し回復する。'},
 potion:{name:'回復薬',icon:'🧪',value:18,kind:'heal',desc:'HPを6回復する。'},
 stone:{name:'投げ石',icon:'🪨',value:5,kind:'throw',desc:'投げると正面の敵に3ダメージ。'},
 sword:{name:'錆びた剣',icon:'🗡️',value:25,kind:'weapon',desc:'攻撃力が2上がる。装備して攻撃しよう。'},
 shield:{name:'木の盾',icon:'🛡️',value:20,kind:'shield',desc:'受けるダメージを1減らす。'},
 escape:{name:'帰還の巻物',icon:'🌀',value:22,kind:'escape',desc:'どこからでも迷宮を脱出できる。'},
 poison:{name:'毒草',icon:'🍂',value:2,kind:'poison',desc:'食べるとHPが3減る。'}
};
let s,uid=0;
function fresh(keep={}){s={x:1,y:1,hp:14,maxHp:14,food:100,depth:1,turn:0,gold:keep.gold||0,escapes:keep.escapes||0,secured:keep.secured||0,found:keep.found||new Set(),best:keep.best||1,bag:[],weapon:null,shield:null,tiles:[],seen:new Set(),enemies:[],items:[],over:false,front:[0,1],groundPickup:null};document.getElementById('bagpanel').classList.remove('inventory-open');document.getElementById('layout').classList.add('inventory-hidden');document.getElementById('pickup').textContent='B 持ち物';makeFloor();say('迷宮に入った。歩けばHPが回復する。道具を活用して戦利品を持ち帰ろう。');render()}
function makeFloor(){s.tiles=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>(!x||!y||x===N-1||y===N-1)?1:0));[[3,1],[3,2],[3,3],[3,4],[6,2],[7,2],[8,2],[6,3],[6,4],[2,6],[3,6],[4,6],[7,6],[7,7],[7,8],[4,8],[5,8]].forEach(([x,y])=>s.tiles[y][x]=1);[[3,5],[5,6],[7,5],[6,8],[8,8]].forEach(([x,y])=>s.tiles[y][x]=0);s.tiles[1][1]=0;s.tiles[9][9]=0;s.x=1;s.y=1;s.seen=new Set();s.enemies=[];s.items=[];
const enemies=s.depth===1?[[5,3,'rat'],[8,5,'bat'],[5,9,'rat']]:[[5,3,'rat'],[8,5,'bat'],[5,9,'rat'],[9,7,'bat']];
enemies.forEach(([x,y,type])=>{if(!s.tiles[y][x])s.enemies.push({x,y,type,hp:s.depth>=3?6:4,atk:s.depth>=3?3:2})});
let pool=s.depth===1?['herb','scroll','seed','potion','stone','sword','shield']:['herb','scroll','seed','potion','stone','shield','escape','herb','poison'];
[[2,2],[5,1],[8,3],[2,8],[9,5],[5,7]].forEach(([x,y],i)=>{if(!s.tiles[y][x]&&!s.enemies.some(e=>e.x===x&&e.y===y))s.items.push({x,y,id:pool[Math.floor(Math.random()*pool.length)],uid:++uid})});s.best=Math.max(s.best,s.depth)}
function say(t){let el=document.getElementById('log'),d=document.createElement('div');d.textContent='› '+t;el.prepend(d);while(el.children.length>18)el.lastChild.remove()}
function popModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalwrap').style.display='grid'}
function closeModal(){document.getElementById('modalwrap').style.display='none'}
function end(title,text){document.getElementById('endtitle').textContent=title;document.getElementById('endtext').textContent=text;document.getElementById('endwrap').style.display='grid'}
function reveal(){for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(Math.abs(dx)+Math.abs(dy)<=4&&s.x+dx>=0&&s.y+dy>=0&&s.x+dx<N&&s.y+dy<N)s.seen.add((s.x+dx)+','+(s.y+dy))}
function blocked(x,y){return x<0||y<0||x>=N||y>=N||s.tiles[y][x]===1}
function frontEnemy(){return s.enemies.find(e=>e.x===s.x+s.front[0]&&e.y===s.y+s.front[1])}
function turnToEnemy(){if(!s.enemies.length){say('近くに敵はいない。');return}let list=s.enemies.map(e=>({...e,dist:Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y))})).filter(e=>e.dist<=6).sort((a,b)=>a.dist-b.dist);if(!list.length){say('見える範囲に敵はいない。');return}let e=list[0];s.front=[Math.sign(e.x-s.x),Math.sign(e.y-s.y)];say('敵の方向を向いた。')}
function showMap(){let rows='';for(let y=0;y<N;y++){let row='';for(let x=0;x<N;x++){if(x===s.x&&y===s.y)row+='＠';else if(!s.seen.has(x+','+y))row+='？';else if(s.tiles[y][x])row+='■';else if(s.enemies.some(e=>e.x===x&&e.y===y))row+='敵';else if(s.items.some(i=>i.x===x&&i.y===y))row+='◆';else if(x===9&&y===9)row+='階';else row+='・'}rows+='<div>'+row+'</div>'}popModal('<h2>全体マップ</h2><div style="font:16px/1.5 monospace;white-space:pre;background:#0b1217;padding:10px;border-radius:6px">'+rows+'</div><button id="mapClose" style="width:100%;margin-top:10px">閉じる</button>');document.getElementById('mapClose').onclick=closeModal}
function doMove(dx,dy){if(s.over)return;s.front=[dx,dy];const nx=s.x+dx,ny=s.y+dy;if(blocked(nx,ny)){say('壁に阻まれた。');return}const e=s.enemies.find(e=>e.x===nx&&e.y===ny);if(e){attackEnemy(e);turnEnd();return}s.x=nx;s.y=ny;const oldHp=s.hp;s.hp=Math.min(s.maxHp,s.hp+1);if(s.hp>oldHp)say('歩いてHPが1回復した。');reveal();const ground=s.items.find(i=>i.x===s.x&&i.y===s.y);if(ground){if(s.bag.length<CAP){s.bag.push(ground);s.items=s.items.filter(i=>i.uid!==ground.uid);s.groundPickup=null;s.found.add(ground.id);say(nameOf(ground)+'を自動で拾った。')}else{s.groundPickup=ground;say('持ち物がいっぱい。足元に道具が残った。')}}turnEnd()}
function attackEnemy(e){let dmg=3+(s.weapon?2:0);e.hp-=dmg;say('攻撃！ '+dmg+'ダメージ。');if(e.hp<=0){s.enemies=s.enemies.filter(q=>q!==e);say('敵を倒した！');if(Math.random()<.5){let id=['stone','seed','herb'][Math.floor(Math.random()*3)];s.items.push({x:e.x,y:e.y,id,uid:++uid});say('敵が道具を落とした。')}}}
function turnEnd(tickFood=true){if(s.over)return;if(tickFood&&s.turn%3===2){s.food=Math.max(0,s.food-1);if(s.food>0)say('行動を重ね、満腹度が1減った。')}s.turn++;enemyTurn();if(s.food<=0){s.hp--;say('空腹でHPが減った。')}if(s.hp<=0)fail();render()}
function enemyTurn(){if(s.over)return;for(const e of s.enemies){const dx=Math.sign(s.x-e.x),dy=Math.sign(s.y-e.y),d=Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y));if(d<=1){s.hp-=Math.max(1,e.atk-(s.shield?1:0));say((e.type==='bat'?'洞窟コウモリ':'迷宮ネズミ')+'の攻撃！');continue}if(d<=5){const opts=[[dx,dy],[dx,0],[0,dy],[dx,-dy],[-dx,dy],[0,-dy],[-dx,0]].filter(a=>a[0]||a[1]);const candidates=opts.map(([mx,my])=>({x:e.x+mx,y:e.y+my})).filter(p=>!blocked(p.x,p.y)&&!s.enemies.some(q=>q!==e&&q.x===p.x&&q.y===p.y)&&!(p.x===s.x&&p.y===s.y)).sort((a,b)=>Math.max(Math.abs(a.x-s.x),Math.abs(a.y-s.y))-Math.max(Math.abs(b.x-s.x),Math.abs(b.y-s.y)));if(candidates.length){const p=candidates[0];e.x=p.x;e.y=p.y}}}}
function openPickup(){if(s.over)return;const item=s.items.find(i=>i.x===s.x&&i.y===s.y);if(!item){say('足元には何もない。');return}if(s.bag.length>=CAP){popModal('<h2>持ち物がいっぱい</h2><p>何かを置いて空きを作るか、拾うのをやめます。</p><div class="itembig"><div class="bigico">'+iconOf(item.id)+'</div><div><strong>'+nameOf(item)+'</strong><small>拾うときの判断が必要だ。</small></div></div><div class="fullitems" id="replaceList"></div><button style="width:100%;margin-top:8px" id="cancelPick">拾わない</button>');let list=document.getElementById('replaceList');s.bag.forEach((it,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span>'+iconOf(it.id)+'</span><span>'+displayName(it)+'<small>これを置いて拾う</small></span>';b.onclick=()=>{dropFromBag(i);s.bag.push(item);s.items=s.items.filter(q=>q.uid!==item.uid);s.groundPickup=null;closeModal();say(nameOf(item)+'を拾い、'+displayName(it)+'を置いた。');turnEnd();render()};list.appendChild(b)});document.getElementById('cancelPick').onclick=closeModal;return}
s.bag.push(item);s.items=s.items.filter(i=>i.uid!==item.uid);s.groundPickup=null;s.found.add(item.id);say(nameOf(item)+'を拾った。');turnEnd();render()}
function nameOf(it){return itemDefs[it.id].name}
function displayName(it){return itemDefs[it.id].unknown&&!it.identified?itemDefs[it.id].name:itemDefs[it.id].name}
function iconOf(id){return itemDefs[id].icon}
function selectItem(i){const it=s.bag[i];if(!it)return;const d=itemDefs[it.id];const unknown=d.unknown&&!it.identified;let desc=unknown?'用途不明。使ってみるか、巻物などで正体を調べよう。':d.desc;
let buttons='';
if(['grass','scroll','food','heal','poison','escape'].includes(d.kind))buttons+='<button data-act="use">使う</button>';
if(d.kind==='weapon'||d.kind==='shield')buttons+='<button data-act="equip">'+((s.weapon===it||s.shield===it)?'装備中':'装備する')+'</button>';
buttons+='<button data-act="throw">投げる</button><button data-act="drop">足元に置く</button><button data-act="discard">捨てる</button>';
if(unknown)buttons+='<button data-act="inspect">観察する</button>';
buttons+='<button data-act="close">閉じる</button>';
popModal('<h2>アイテム</h2><div class="itembig"><div class="bigico">'+d.icon+'</div><div><strong>'+displayName(it)+(s.weapon===it||s.shield===it?' <span style="color:#f4d17c">装備中</span>':'')+'</strong><small>'+desc+'</small><small>売却価値の目安：'+d.value+' G</small></div></div><div class="modalactions">'+buttons+'</div><div class="notice">※行動を伴う操作では敵も1ターン行動します。</div>');
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='close'){closeModal();return}closeModal();if(a==='use')useItem(i);if(a==='equip')equipItem(i);if(a==='throw')throwItem(i);if(a==='drop')dropItem(i);if(a==='discard')discardItem(i);if(a==='inspect')inspectItem(i)})}
function useItem(i){let it=s.bag[i];if(!it)return;let d=itemDefs[it.id];if(d.unknown&&!it.identified){it.identified=true;s.found.add(it.id);if(it.id==='herb'){const effect=Math.random();it.actual=effect<.72?'heal':'poison'}if(it.id==='scroll'){it.actual=Math.random()<.6?'identify':'map'}say('正体を確かめるために使った……');}
let effect=it.actual||it.id;
if(effect==='herb'||effect==='heal'||effect==='potion'){let amt=effect==='herb'?5:6;let before=s.hp;s.hp=Math.min(s.maxHp,s.hp+amt);say('HPが'+(s.hp-before)+'回復した。');removeItem(i)}
else if(effect==='poison'||effect==='poisonHerb'){s.hp-=3;say('毒草だった！ HPが3減った。');removeItem(i)}
else if(effect==='scroll'||effect==='identify'){let target=s.bag.find((x,j)=>j!==i&&itemDefs[x.id].unknown&&!x.identified);if(target){target.identified=true;say(target.id==='herb'?'草の正体が分かった。':'巻物の正体が分かった。');}else say('周囲に調べる対象がない。');removeItem(i)}
else if(effect==='map'){s.seen=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;x++)s.seen.add(x+','+y);say('巻物が光り、フロア全体が見えた！');removeItem(i)}
else if(effect==='seed'){s.food=Math.min(100,s.food+25);say('満腹度が回復した。');removeItem(i)}
else if(effect==='escape'){closeModal();secure();return}
else{say('使い方が分からない。');}
turnEnd();render()}
function removeItem(i){const it=s.bag[i];if(it===s.weapon)s.weapon=null;if(it===s.shield)s.shield=null;s.bag.splice(i,1)}
function equipItem(i){const it=s.bag[i],kind=itemDefs[it.id].kind;if(kind==='weapon'){if(s.weapon&&s.weapon!==it)say(s.weapon.name+'を外した。');s.weapon=it;say('錆びた剣を装備。攻撃力+2。')}else if(kind==='shield'){s.shield=it;say('木の盾を装備。被ダメージ-1。')}turnEnd();render()}
function throwItem(i){const it=s.bag[i],e=frontEnemy();if(e){let dmg=it.id==='stone'?3:2;e.hp-=dmg;say(itemDefs[it.id].name+'を投げた！ '+dmg+'ダメージ。');if(e.hp<=0){s.enemies=s.enemies.filter(q=>q!==e);say('敵を倒した！')}}else{let x=s.x+s.front[0],y=s.y+s.front[1];if(blocked(x,y)){say('壁に当たって道具が足元に落ちた。')}else{s.items.push({x,y,id:it.id,uid:++uid,identified:it.identified,actual:it.actual});say(itemDefs[it.id].name+'を投げた。')}}removeItem(i);turnEnd();render()}
function dropItem(i){const it=s.bag[i];s.items.push({x:s.x,y:s.y,id:it.id,uid:++uid,identified:it.identified,actual:it.actual});removeItem(i);say(itemDefs[it.id].name+'を足元に置いた。');closeModal();render()}
function discardItem(i){let nm=itemDefs[s.bag[i].id].name;removeItem(i);say(nm+'を捨てた。戻せない。');turnEnd();render()}
function dropFromBag(i){let it=s.bag[i];s.items.push({x:s.x,y:s.y,id:it.id,uid:++uid,identified:it.identified,actual:it.actual});removeItem(i)}
function inspectItem(i){const it=s.bag[i];if(!it)return;if(it.id==='scroll'){it.identified=true;const target=s.bag.find((x,j)=>j!==i&&itemDefs[x.id].unknown&&!x.identified);if(target){target.identified=true;say('巻物を読み、'+itemDefs[target.id].name+'の正体を見破った。')}else say('巻物の文字は「道具を見極めよ」と読める。');}else if(itemDefs[it.id].unknown){say('匂い・手触りだけでは用途を断定できない。使えば正体が分かるかもしれない。')}else say(itemDefs[it.id].desc);render()}
function waitTurn(){if(s.over)return;say('周囲を警戒して待機した。');turnEnd()}
function descend(){if(s.over)return;if(s.x!==9||s.y!==9){say('階段は右下。紫色の床まで進もう。');return}s.depth++;s.hp=Math.min(s.maxHp,s.hp+1);makeFloor();say('B'+s.depth+'Fへ進んだ。敵が強くなり、珍しい道具も増えた。');render()}
function secure(){const value=s.bag.reduce((a,it)=>a+itemDefs[it.id].value,0);s.gold+=value;s.secured+=s.bag.length;s.escapes++;s.bag=[];s.over=true;say('帰還成功。戦利品を確保：'+value+'G');document.getElementById('endtitle').textContent='帰還成功！';document.getElementById('endtext').textContent='戦利品を確保しました。今回の獲得 '+value+' G。';document.getElementById('endwrap').style.display='grid';render()}
function escape(){if(s.over)return;if(s.x===1&&s.y===1){secure();return}say('帰還口は左上。そこまで戻るか、帰還の巻物を使おう。')}
function fail(){if(s.over)return;s.over=true;s.bag=[];say('力尽きた。今回の未確保品を失った。');document.getElementById('endtitle').textContent='力尽きた';document.getElementById('endtext').textContent='今回の持ち物は失われました。発見記録と過去に持ち帰った資金は残ります。';document.getElementById('endwrap').style.display='grid'}
function tile(x,y){let px=x*T,py=y*T;if(!s.seen.has(x+','+y)){c.fillStyle='#080d12';c.fillRect(px,py,T,T);return}if(s.tiles[y][x]){c.fillStyle='#2b3b42';c.fillRect(px,py,T,T);c.fillStyle='#3d4f54';c.fillRect(px+1,py+1,T-2,3);c.fillStyle='#1b282e';c.fillRect(px+2,py+9,T-4,2);c.fillRect(px+5,py+24,6,3)}else{c.fillStyle=((x*13+y*7)%4===0)?'#5d604a':'#4c5141';c.fillRect(px,py,T,T);c.fillStyle='#73735a';c.fillRect(px+2,py+3,T-4,1);c.fillStyle='#404739';c.fillRect(px+8,py+15,3,2);c.fillRect(px+26,py+27,4,2)}}
function drawHero(x,y){let a=x*T,b=y*T;const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(a+x,b+y,w,h)};r(10,31,21,4,'#27251e');r(13,25,7,7,'#75472f');r(23,25,7,7,'#75472f');r(11,15,20,13,'#3e8069');r(9,17,5,10,'#c49a58');r(28,17,5,10,'#c49a58');r(13,6,17,13,'#d6a16c');r(10,4,22,7,'#50392a');r(14,1,14,5,'#7c5738');r(15,10,3,3,'#292522');r(24,10,3,3,'#292522');r(18,15,7,2,'#f2d6a2');r(31,14,3,15,'#c9d1c5');r(29,12,6,4,'#f2dfae')}
function drawEnemy(e){let a=e.x*T,b=e.y*T;const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(a+x,b+y,w,h)};r(10,31,21,4,'#24221c');if(e.type==='bat'){r(4,13,12,9,'#574a70');r(25,13,12,9,'#574a70');r(11,10,18,16,'#78658b');r(14,7,5,5,'#b8a4c7');r(23,7,5,5,'#b8a4c7');r(14,15,4,4,'#f4dc79');r(23,15,4,4,'#f4dc79')}else{r(9,14,23,14,'#796d57');r(11,9,18,13,'#9c8b6d');r(12,5,5,7,'#b5a284');r(24,5,5,7,'#b5a284');r(14,14,4,4,'#ec6b58');r(24,14,4,4,'#ec6b58')}}
function drawItem(it){let a=it.x*T,b=it.y*T;const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(a+x,b+y,w,h)};let id=it.id;if(id==='herb'||id==='poison'){r(18,18,4,13,'#568f43');r(8,15,15,7,id==='poison'?'#9a9e54':'#8dc96a');r(20,9,12,8,id==='poison'?'#777b45':'#a5dc73')}else if(id==='scroll'||id==='escape'){r(12,11,17,21,'#c8b888');r(15,14,11,15,id==='escape'?'#6e81bd':'#e5d8ae');r(17,17,7,2,'#8e7950');r(17,22,7,2,'#8e7950')}else if(id==='seed'){r(13,14,15,16,'#986e3e');r(16,11,10,17,'#bd8a4c');r(19,14,4,9,'#e0bd76')}else if(id==='potion'){r(17,8,9,5,'#d8c8a3');r(15,12,13,18,'#4aa9c8');r(18,15,7,10,'#9be6e9')}else if(id==='stone'){r(12,17,17,13,'#858f91');r(15,12,13,15,'#aeb8b3');r(19,15,5,8,'#d6ded5')}else if(id==='sword'){r(18,7,5,20,'#d5dfdf');r(14,12,13,4,'#f4f0cf');r(19,26,4,7,'#946c43')}else if(id==='shield'){r(12,10,18,21,'#8b6848');r(15,13,12,14,'#b48b5a');r(19,13,4,14,'#e0c78a')}if(it.id==='relic'){r(15,9,12,22,'#f3d57c')}}
function render(){reveal();c.clearRect(0,0,440,440);c.save();
// カメラをプレイヤーに追従させ、キャラクターは画面中央に固定してマップ側を動かす
const camX=(Math.floor(440/T)/2|0)-s.x,camY=(Math.floor(440/T)/2|0)-s.y;c.translate(camX*T,camY*T);
for(let y=0;y<N;y++)for(let x=0;x<N;x++)tile(x,y);for(const it of s.items)if(s.seen.has(it.x+','+it.y))drawItem(it);for(const e of s.enemies)if(s.seen.has(e.x+','+e.y))drawEnemy(e);if(s.seen.has('1,1')){c.fillStyle='#b48c4d';c.fillRect(50,50,20,20);c.fillStyle='#58452b';c.fillRect(56,56,8,14)}if(s.seen.has('9,9')){c.fillStyle='#63528b';c.fillRect(368,368,24,24);c.fillStyle='#bba7e6';c.fillRect(373,373,14,14)}drawHero(s.x,s.y);c.restore();
document.getElementById('hptext').textContent=s.hp+' / '+s.maxHp;document.getElementById('hpbar').style.width=s.hp/s.maxHp*100+'%';document.getElementById('foodtext').textContent=s.food+'%';document.getElementById('foodbar').style.width=s.food+'%';document.getElementById('depthtext').textContent='B'+s.depth+'F';document.getElementById('goldtext').textContent=s.gold+' G';document.getElementById('floorlabel').textContent='OLD RUINS · B'+s.depth+'F';document.getElementById('task').textContent=s.bag.length?'戦利品 '+s.bag.reduce((a,it)=>a+itemDefs[it.id].value,0)+'G相当':'足元の道具を拾ってみよう';
let bag=document.getElementById('bag');bag.innerHTML='';for(let i=0;i<CAP;i++){let el=document.createElement('button');el.className='slot'+(i>=s.bag.length?' empty':'');if(i<s.bag.length){let it=s.bag[i],d=itemDefs[it.id];el.innerHTML='<span class="ico">'+d.icon+'</span><span class="nm">'+(d.unknown&&!it.identified?d.name:d.name)+'</span>';if(it===s.weapon||it===s.shield)el.classList.add('equipped');el.onclick=()=>selectItem(i)}else{el.textContent='空き';el.disabled=true}bag.appendChild(el)}
document.getElementById('baghint').textContent=s.bag.length+'/'+CAP+'個。金枠は装備中。スロットを選んでアイテム操作。';
document.getElementById('pickup').disabled=s.over;document.getElementById('attack').disabled=s.over;document.getElementById('escape').disabled=s.over;document.getElementById('descend').disabled=s.over;document.getElementById('wait').disabled=s.over}
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>doMove(...b.dataset.move.split(',').map(Number)));
document.getElementById('pickup').onclick=()=>{const panel=document.getElementById('bagpanel'),layout=document.getElementById('layout');const open=panel.classList.toggle('inventory-open');layout.classList.toggle('inventory-hidden',!open);document.getElementById('pickup').textContent=open?'B 持ち物を閉じる':'B 持ち物';};document.getElementById('attack').onclick=()=>{if(s.over)return;let e=frontEnemy();if(e)attackEnemy(e);else say('正面に敵はいない。');turnEnd()};
document.getElementById('escape').onclick=escape;document.getElementById('descend').onclick=descend;document.getElementById('wait').onclick=waitTurn;
document.getElementById('faceEnemy').onclick=()=>{turnToEnemy();render()};
document.getElementById('showMap').onclick=showMap;
document.getElementById('history').onclick=()=>popModal('<h2>メッセージ履歴</h2><div class="log">'+document.getElementById('log').innerHTML+'</div><button id="closeHistory" style="width:100%;margin-top:10px">閉じる</button>');
document.getElementById('menu').onclick=()=>popModal('<h2>メニュー</h2><div class="modalactions"><button id="menuMap">全体マップ</button><button id="menuClose">閉じる</button></div>');
document.addEventListener('click',e=>{if(e.target.id==='closeHistory'||e.target.id==='menuClose'||e.target.id==='mapClose')closeModal();if(e.target.id==='menuMap')showMap()});
document.getElementById('restart').onclick=()=>{closeModal();document.getElementById('endwrap').style.display='none';fresh()};
document.getElementById('continue').onclick=()=>{document.getElementById('endwrap').style.display='none';fresh({gold:s.gold,escapes:s.escapes,secured:s.secured,found:s.found,best:s.best})};
window.addEventListener('keydown',e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],q:[-1,-1],e:[1,-1],z:[-1,1],c:[1,1]};if(m[e.key]){e.preventDefault();doMove(...m[e.key])}});
// HUDはマップの外、持ち物はボタン操作時だけ表示。キャラクターを覆わない。
fresh();
})();
</script></body></html>
