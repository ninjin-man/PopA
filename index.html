function makeFloor(){
  // BSP（空間分割）で部屋サイズを変え、部屋同士を通路で接続する。
  s.tiles=Array.from({length:N},()=>Array(N).fill(1));
  const root={x:1,y:1,w:N-2,h:N-2,depth:0},leaves=[];
  function splitArea(area){
    const canV=area.w>=12,canH=area.h>=12;
    if(area.depth>=3||(!canV&&!canH)||(area.depth>=2&&Math.random()<.28)){leaves.push(area);return;}
    let vertical;
    if(canV&&!canH)vertical=true;else if(canH&&!canV)vertical=false;
    else if(area.w>area.h*1.18)vertical=true;else if(area.h>area.w*1.18)vertical=false;else vertical=Math.random()<.5;
    const size=vertical?area.w:area.h,cut=Math.max(6,Math.min(size-6,Math.floor(size*(.38+Math.random()*.24))));
    if(vertical){splitArea({x:area.x,y:area.y,w:cut,h:area.h,depth:area.depth+1});splitArea({x:area.x+cut,y:area.y,w:area.w-cut,h:area.h,depth:area.depth+1});}
    else{splitArea({x:area.x,y:area.y,w:area.w,h:cut,depth:area.depth+1});splitArea({x:area.x,y:area.y+cut,w:area.w,h:area.h-cut,depth:area.depth+1});}
  }
  splitArea(root);
  const rooms=[];
  for(const area of leaves){
    const maxW=Math.max(4,area.w-2),maxH=Math.max(4,area.h-2);
    const minW=Math.min(maxW,Math.max(4,Math.floor(area.w*.52))),minH=Math.min(maxH,Math.max(4,Math.floor(area.h*.52)));
    const w=minW+Math.floor(Math.random()*(maxW-minW+1)),h=minH+Math.floor(Math.random()*(maxH-minH+1));
    let x=area.x+1+Math.floor(Math.random()*Math.max(1,area.w-w-1));
    let y=area.y+1+Math.floor(Math.random()*Math.max(1,area.h-h-1));
    if(area.x===1&&area.y===1){x=2;y=2;}
    if(area.x+area.w===N-1&&area.y+area.h===N-1){x=area.x+area.w-w-1;y=area.y+area.h-h-1;}
    const room={x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2),area};rooms.push(room);
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)s.tiles[yy][xx]=0;
  }
  function carveCorridor(a,b){
    let x=a.cx,y=a.cy;s.tiles[y][x]=0;
    if(Math.random()<.5){while(x!==b.cx){x+=Math.sign(b.cx-x);s.tiles[y][x]=0;}while(y!==b.cy){y+=Math.sign(b.cy-y);s.tiles[y][x]=0;}}
    else{while(y!==b.cy){y+=Math.sign(b.cy-y);s.tiles[y][x]=0;}while(x!==b.cx){x+=Math.sign(b.cx-x);s.tiles[y][x]=0;}}
  }
  const startRoom=rooms.find(r=>r.x<=2&&r.x+r.w>2&&r.y<=2&&r.y+r.h>2)||rooms[0],connected=new Set([startRoom]);
  while(connected.size<rooms.length){
    let best=null,bestDist=Infinity;
    for(const a of connected)for(const b of rooms)if(!connected.has(b)){const d=Math.abs(a.cx-b.cx)+Math.abs(a.cy-b.cy);if(d<bestDist){bestDist=d;best=[a,b];}}
    if(!best)break;carveCorridor(best[0],best[1]);connected.add(best[1]);
  }
  let extraLinks=0;
  for(let i=0;i<rooms.length&&extraLinks<2;i++){const a=rooms[i],candidates=rooms.slice(i+1).filter(b=>Math.abs(a.cx-b.cx)+Math.abs(a.cy-b.cy)<=15);if(candidates.length&&Math.random()<.32){carveCorridor(a,candidates[Math.floor(Math.random()*candidates.length)]);extraLinks++;}}
  const sx=2,sy=2,stair=N-4;s.tiles[sy][sx]=0;s.tiles[stair][stair]=0;
  const reachable=new Set([sx+','+sy]),queue=[[sx,sy]];
  for(let qi=0;qi<queue.length;qi++){const [x,y]=queue[qi];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(nx>0&&ny>0&&nx<N-1&&ny<N-1&&s.tiles[ny][nx]===0&&!reachable.has(k)){reachable.add(k);queue.push([nx,ny]);}}}
  if(!reachable.has(stair+','+stair)){let x=sx,y=sy;while(x!==stair){x+=Math.sign(stair-x);s.tiles[y][x]=0;}while(y!==stair){y+=Math.sign(stair-y);s.tiles[y][x]=0;}}
  s.x=sx;s.y=sy;s.seen=new Set();s.enemies=[];s.items=[];s.traps=[];s.groundPickup=null;
  const occupied=(x,y)=>((x===sx&&y===sy)||(x===stair&&y===stair)||s.enemies.some(e=>e.x===x&&e.y===y)||s.items.some(i=>i.x===x&&i.y===y));
  let cells=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(!blocked(x,y)&&!occupied(x,y))cells.push([x,y]);
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};shuffle(cells);
  const types=s.depth===1?['rat','bat','rat','runner','archer','thief','tank','spitter','rat','hungry','leech']:['rat','bat','runner','archer','thief','tank','leech','hungry','spitter','alarm','rat','bat'];
  const n=Math.min(types.length,8+Math.floor(Math.random()*4)),enemyCells=shuffle(cells.filter(([x,y])=>Math.max(Math.abs(x-sx),Math.abs(y-sy))>3&&Math.max(Math.abs(x-stair),Math.abs(y-stair))>1));
  for(let i=0;i<n&&enemyCells.length;i++){const [x,y]=enemyCells.pop(),type=types[i],inf=enemyInfo[type];s.enemies.push({x,y,type,hp:inf.hp+Math.floor((s.depth-1)*1.1),atk:inf.atk+Math.floor((s.depth-1)*.6),sleep:0,alert:0,targetX:null,targetY:null,stole:false,drainCooldown:0});}
  const enemySet=new Set(s.enemies.map(e=>e.x+','+e.y));cells=cells.filter(([x,y])=>!enemySet.has(x+','+y));
  const trapCount=3+Math.floor(Math.random()*3),trapTypes=['spike','pit','snare','alarm'];for(let i=0;i<trapCount&&cells.length;i++){const j=Math.floor(Math.random()*cells.length),[x,y]=cells.splice(j,1)[0];s.traps.push({x,y,type:trapTypes[Math.floor(Math.random()*trapTypes.length)],revealed:false,triggered:false});}
  const pool=s.depth===1?['herb','scroll','seed','potion','stone','sword','shortSword','club','shield','leatherShield','bronzeShield','stone','rice','berry','hardBread','ironStone','sleepHerb','strengthHerb','knockStaff','hungerBracelet']:['herb','scroll','seed','potion','stone','escape','poison','broadSword','ironSword','katana','battleAxe','ironShield','heavyShield','spikedShield','dragonShield','rice','bigRice','driedMeat','ironStone','poisonDart','sleepStaff','slowStaff','swapStaff','hungerBracelet','powerBracelet','healJar','identifyJar','mapScroll','blastScroll'];
  if(s.depth>=3)pool.push('relic','crystalBlade','windBlade','towerShield','windShield','lightningStaff','sealStaff','fortuneBracelet','dodgeBracelet','escapeJar','royalMeal','heavyRock','changeJar','powerScroll');
  const rareIds=new Set(['relic','crystalBlade','windBlade','towerShield','windShield','lightningStaff','sealStaff','fortuneBracelet','dodgeBracelet','escapeJar','royalMeal','heavyRock','changeJar','powerScroll']);
  for(const id of Object.keys(itemDefs)){if(!pool.includes(id)&&(s.depth>=3||!rareIds.has(id))&&!(itemDefs[id].kind==='treasure'&&s.depth<3))pool.push(id);}
  const count=Math.random()<.15?0:1+Math.floor(Math.random()*5);for(let i=0;i<count&&cells.length;i++){const [x,y]=cells.pop();s.items.push(makeItem(x,y,pool[Math.floor(Math.random()*pool.length)]));}
  s.best=Math.max(s.best,s.depth);
}

function reveal(){for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=s.x+dx,y=s.y+dy;if(Math.abs(dx)+Math.abs(dy)<=4&&x>=0&&y>=0&&x<N&&y<N&&lineClear(s.x,s.y,x,y))s.seen.add(x+','+y)}}
function blocked(x,y){return x<0||y<0||x>=N||y>=N||s.tiles[y][x]===1}
function canStep(x,y,dx,dy){const nx=x+dx,ny=y+dy;if(blocked(nx,ny))return false;if(dx&&dy&&(blocked(x+dx,y)||blocked(x,y+dy)))return false;return true;}
function makeItem(x,y,id,extra={}){const it={x,y,id,uid:++uid,...extra};if(id==='herb'&&!('actual'in it))it.actual=Math.random()<.72?'heal':'poison';if(id==='scroll'&&!('actual'in it)){const r=Math.random();it.actual=r<.42?'identify':r<.78?'map':'sleep';}return it;}
function placeGroundItem(x,y,id,extra={}){if(!blocked(x,y)&&!s.items.some(i=>i.x===x&&i.y===y)&&!s.enemies.some(e=>e.x===x&&e.y===y)){s.items.push(makeItem(x,y,id,extra));return}for(let r=1;r<N;r++)for(let yy=1;yy<N-1;yy++)for(let xx=1;xx<N-1;xx++)if(Math.abs(xx-x)+Math.abs(yy-y)===r&&!blocked(xx,yy)&&!s.items.some(i=>i.x===xx&&i.y===yy)&&!s.enemies.some(e=>e.x===xx&&e.y===yy)){s.items.push(makeItem(xx,yy,id,extra));return}}
function lineClear(x1,y1,x2,y2){let dx=Math.abs(x2-x1),dy=Math.abs(y2-y1),sx=x1<x2?1:-1,sy=y1<y2?1:-1,err=dx-dy,x=x1,y=y1;while(!(x===x2&&y===y2)){const e2=2*err;if(e2>-dy){err-=dy;x+=sx}if(e2<dx){err+=dx;y+=sy}if(x===x2&&y===y2)break;if(blocked(x,y))return false}return true;}
function aligned(x1,y1,x2,y2){const dx=Math.abs(x2-x1),dy=Math.abs(y2-y1);return dx===0||dy===0||dx===dy;}
function nextPathStep(e,gx=s.x,gy=s.y){if(e.x===gx&&e.y===gy)return null;const start=e.x+','+e.y,goal=gx+','+gy,q=[[e.x,e.y]],prev=new Map([[start,null]]);for(let i=0;i<q.length;i++){const [x,y]=q[i],k=x+','+y;if(k===goal)break;for(const [dx,dy] of DIRS){if(!canStep(x,y,dx,dy))continue;const nx=x+dx,ny=y+dy,nk=nx+','+ny;if(nk!==goal&&s.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny))continue;if(!prev.has(nk)){prev.set(nk,k);q.push([nx,ny]);}}}if(!prev.has(goal))return null;let cur=goal,par=prev.get(cur);while(par&&par!==start){cur=par;par=prev.get(cur)}const [x,y]=cur.split(',').map(Number);return {x,y};}

function turnToEnemy(){if(!s.enemies.length){say('近くに敵はいない。');return}let list=s.enemies.map(e=>({...e,dist:Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y))})).filter(e=>e.dist<=6&&lineClear(s.x,s.y,e.x,e.y)).sort((a,b)=>a.dist-b.dist);if(!list.length){say('視界内に敵はいない。');return}let e=list[0];s.front=[Math.sign(e.x-s.x),Math.sign(e.y-s.y)];say('見えている敵の方向を向いた。')}
function showMap(){let cells='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const key=x+','+y,seen=s.seen.has(key);let cls='map-unknown';if(seen){if(s.tiles[y][x])cls='map-wall';else cls='map-floor';if(x===N-4&&y===N-4)cls='map-stairs';if(s.items.some(i=>i.x===x&&i.y===y))cls='map-item';if(s.enemies.some(e=>e.x===x&&e.y===y&&Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y))<=4&&lineClear(s.x,s.y,e.x,e.y)))cls='map-enemy';if(x===s.x&&y===s.y)cls='map-player'}cells+='<span class="mapdot '+cls+'"></span>'}popModal('<h2>全体マップ</h2><div style="display:flex;justify-content:center;overflow:auto;max-width:100%;background:#080e13;padding:9px;border-radius:7px"><div class="mapgrid" style="display:grid;grid-template-columns:repeat('+N+',11px);grid-auto-rows:11px;gap:1px;width:max-content">'+cells+'</div></div><div class="maplegend"><span><i class="mapdot map-floor"></i>部屋・通路</span><span><i class="mapdot map-wall"></i>壁</span><span><i class="mapdot map-unknown"></i>未探索</span><span><i class="mapdot map-player"></i>自分</span><span><i class="mapdot map-enemy"></i>敵</span><span><i class="mapdot map-item"></i>道具</span><span><i class="mapdot map-stairs"></i>階段</span></div><button id="mapClose" style="width:100%;margin-top:10px">閉じる</button>');document.getElementById('mapClose').onclick=closeModal}
function doMove(dx,dy){if(s.over)return;s.front=[dx,dy];const nx=s.x+dx,ny=s.y+dy;if(!canStep(s.x,s.y,dx,dy)){turnEnd();return}const e=s.enemies.find(e=>e.x===nx&&e.y===ny);if(e){attackEnemy(e);turnEnd();return}s.x=nx;s.y=ny;const trap=s.traps.find(t=>t.x===s.x&&t.y===s.y&&!t.triggered);if(trap){trap.triggered=true;trap.revealed=true;if(trap.type==='spike'){s.hp-=4;say('罠！ トゲ床を踏んだ。HPが4減った。')}else if(trap.type==='pit'){let spots=[];for(let yy=1;yy<N-1;yy++)for(let xx=1;xx<N-1;xx++)if(!blocked(xx,yy)&&!s.enemies.some(e=>e.x===xx&&e.y===yy)&&!(xx===s.x&&yy===s.y))spots.push([xx,yy]);if(spots.length){const pos=spots[Math.floor(Math.random()*spots.length)];s.x=pos[0];s.y=pos[1]}say('落とし穴に落ち、別の場所へ飛ばされた！')}else if(trap.type==='snare'){s.food=Math.max(0,s.food-8);say('罠！ 足を取られ、満腹度が8減った。')}else{for(const e of s.enemies)e.alert=5;say('警報罠が鳴り響いた！ 敵がこちらに気づいた。')}}const threatened=s.enemies.some(e=>{const d=Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y));return d<=4||(e.alert>0&&d<=6)});const before=s.hp;if(!threatened){s.safeWalks++;if(s.safeWalks%3===0)s.hp=Math.min(s.maxHp,s.hp+1)}else s.safeWalks=0;if(s.hp>before)/* 通常移動によるHP回復はHUDで確認する */;if(threatened&&s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='scout')say('探知の腕輪が敵の気配を知らせている。');if(!threatened&&s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='regen')s.hp=Math.min(s.maxHp,s.hp+1);else if(threatened&&s.hp<s.maxHp)say('敵の気配が近い。安全な場所まで離れないと回復できない。');reveal();const item=s.items.find(i=>i.x===s.x&&i.y===s.y);if(item){if(s.bag.length<CAP){s.bag.push(item);s.items=s.items.filter(i=>i.uid!==item.uid);s.groundPickup=null;s.found.add(item.id);say(nameOf(item)+'を拾った。')}else{s.groundPickup=item;say('持ち物がいっぱい。道具は足元に残った。')}}turnEnd();}
function attackEnemy(e){const dmg=Math.max(1,attackPower());e.hp-=dmg;popupDamage(e.x,e.y,dmg,'hit');say(enemyInfo[e.type].name+'に'+dmg+'ダメージを与えた。');if(e.hp<=0)defeatEnemy(e)}
function turnEnd(options={}){if(s.over)return;const tickFood=(s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='hunger')?s.turn%6===5:s.turn%3===2;if(tickFood){s.food=Math.max(0,s.food-1);if(s.food>0){let drain=s.shield&&itemDefs[s.shield.id].heavy?2:1;if(s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='hunger')drain=Math.max(1,drain-1);if(s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='curse')drain*=2;s.food=Math.max(0,s.food-(drain-1));/* 通常の満腹度減少はHUDで確認するためログに出さない */}}s.turn++;if(s.powerTurns>0)s.powerTurns--;if(s.quickTurns>0)s.quickTurns--;if(s.guardHits>0&&s.hp>0){}if(options.enemies!==false){if(s.quickTurns>0&&s.turn%2===0)say('素早さ草の効果で敵の動きが遅れた。');else enemyTurn();}if(s.food<=0){s.hp--;say('空腹でHPが減った。')}if(s.hp<=0)fail();render();}
function defeatEnemy(e){const x=e.x,y=e.y;s.enemies=s.enemies.filter(q=>q!==e);say(enemyInfo[e.type].name+'を倒した！');gainExp(enemyInfo[e.type].exp);if(Math.random()<(s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='finder'?.24:.10)){const id=['stone','seed','herb','ironStone','berry','rice'][Math.floor(Math.random()*6)];placeGroundItem(x,y,id);say('敵が道具を落とした。')}}
function enemyTurn(){
 if(s.over)return;
 for(const e of [...s.enemies]){
  if(s.over||s.hp<=0)break;
  if(e.poison>0){e.poison--;e.hp--;say(enemyInfo[e.type].name+'は毒で1ダメージ。');if(e.hp<=0){defeatEnemy(e);continue}}
  if(e.sleep>0){e.sleep--;continue}
  const dx=s.x-e.x,dy=s.y-e.y,d=Math.max(Math.abs(dx),Math.abs(dy)),clear=lineClear(e.x,e.y,s.x,s.y);
  if(clear&&d<=7){e.alert=5;e.targetX=s.x;e.targetY=s.y}
  if(e.type==='alarm'&&d<=5&&!e.called){e.called=true;say('警笛スライムが仲間を呼んだ！');for(const ally of s.enemies){if(ally!==e&&Math.max(Math.abs(ally.x-e.x),Math.abs(ally.y-e.y))<=5){ally.alert=5;ally.targetX=s.x;ally.targetY=s.y}}}
  if(d<=1){
   if(dx&&dy&&blocked(e.x+Math.sign(dx),e.y)&&blocked(e.x,e.y+Math.sign(dy)))continue;
   if(s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='dodge'&&Math.random()<.18){say('身かわしの腕輪で攻撃を回避！');continue}
   let damage=Math.max(1,e.atk-defensePower());
   if(e.type==='hungry'&&s.food>0){s.food=Math.max(0,s.food-8);say('腹ぺこスライムに満腹度を8吸われた！')}
   s.hp-=damage;popupDamage(s.x,s.y,damage,'hurt');if(s.guardHits>0)s.guardHits--;
   say(enemyInfo[e.type].name+'の攻撃！ '+damage+'ダメージ。');
   if(e.type==='leech'&&e.drainCooldown<=0){e.hp=Math.min(enemyInfo[e.type].hp+Math.floor((s.depth-1)*1.1),e.hp+damage);e.drainCooldown=2;say('吸血スライムがHPを'+damage+'吸収した！')}
   if(e.type==='thief'&&!e.stole&&s.bag.length){const idx=Math.floor(Math.random()*s.bag.length),stolen=s.bag.splice(idx,1)[0];e.stole=true;e.alert=5;e.targetX=e.x+(e.x-s.x)*4;e.targetY=e.y+(e.y-s.y)*4;say('泥棒スライムが'+displayName(stolen)+'を盗んだ！ 逃げ出した！')}
   if(e.reflect>0){e.reflect--;e.hp-=damage;say('痛み分けで敵にも'+damage+'ダメージ。');if(e.hp<=0){defeatEnemy(e);continue}}
   if(s.shield&&itemDefs[s.shield.id].spikes){e.hp-=1;say('棘の盾が反撃！ 敵に1ダメージ。');if(e.hp<=0){defeatEnemy(e);continue}}
   if(e.hp<=0)defeatEnemy(e);
   continue;
  }
  if((e.type==='archer'||e.type==='spitter')&&d<=4&&aligned(e.x,e.y,s.x,s.y)&&clear){
   const damage=Math.max(1,e.atk-defensePower());s.hp-=damage;popupDamage(s.x,s.y,damage,'hurt');if(s.guardHits>0)s.guardHits--;
   say(e.type==='archer'?'石弓ゴブリンの射撃！ '+damage+'ダメージ。':'酸吐きスライムの酸！ '+damage+'ダメージ。');
   if(e.type==='spitter'&&s.food>0){s.food=Math.max(0,s.food-3);say('酸で満腹度も3減った。')}
   continue;
  }
  if(e.type==='runner'&&clear&&d<=2){const options=DIRS.map(([mx,my])=>({x:e.x+mx,y:e.y+my,dx:mx,dy:my})).filter(p=>canStep(e.x,e.y,p.dx,p.dy)&&!s.enemies.some(o=>o!==e&&o.x===p.x&&o.y===p.y)).sort((a,b)=>Math.max(Math.abs(b.x-s.x),Math.abs(b.y-s.y))-Math.max(Math.abs(a.x-s.x),Math.abs(a.y-s.y)));if(options.length){e.x=options[0].x;e.y=options[0].y}continue}
  if(e.type==='thief'&&e.stole){const options=DIRS.map(([mx,my])=>({x:e.x+mx,y:e.y+my,dx:mx,dy:my})).filter(p=>canStep(e.x,e.y,p.dx,p.dy)&&!s.enemies.some(o=>o!==e&&o.x===p.x&&o.y===p.y)).sort((a,b)=>Math.max(Math.abs(b.x-s.x),Math.abs(b.y-s.y))-Math.max(Math.abs(a.x-s.x),Math.abs(a.y-s.y)));if(options.length){e.x=options[0].x;e.y=options[0].y;if(Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y))>7){s.enemies=s.enemies.filter(o=>o!==e);say('泥棒スライムは盗品を持って消えた……');}}continue}
  if(e.type==='tank'&&d>1&&Math.random()<.45)continue;
  if(e.drainCooldown>0)e.drainCooldown--;
  if(e.alert>0&&e.targetX!=null){const step=nextPathStep(e,e.targetX,e.targetY);if(step&&!(step.x===s.x&&step.y===s.y)){e.x=step.x;e.y=step.y}else{e.alert--;if(e.alert===0){e.targetX=null;e.targetY=null}}}
 }
}
function openPickup(){if(s.over)return;const item=s.items.find(i=>i.x===s.x&&i.y===s.y);if(!item){say('足元には何もない。');return}if(s.bag.length>=CAP){popModal('<h2>持ち物がいっぱい</h2><p>置き換える道具を選ぶと、選んだ道具を足元に置いて拾います。</p><div class="fullitems" id="replaceList"></div><button id="cancelPick" style="width:100%;margin-top:8px">拾わない</button>');const list=document.getElementById('replaceList');s.bag.forEach((it,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML='<span>'+iconOf(it.id)+'</span><span>'+displayName(it)+'<small>これを置いて拾う</small></span>';b.onclick=()=>{const dropped=s.bag[i];placeGroundItem(s.x,s.y,dropped.id,{identified:dropped.identified,actual:dropped.actual});removeItem(i);s.bag.push(item);s.items=s.items.filter(q=>q.uid!==item.uid);s.found.add(item.id);closeModal();say(displayName(item)+'を拾い、'+displayName(dropped)+'を置いた。');turnEnd()};list.appendChild(b)});document.getElementById('cancelPick').onclick=closeModal;return}s.bag.push(item);s.items=s.items.filter(i=>i.uid!==item.uid);s.groundPickup=null;s.found.add(item.id);say(nameOf(item)+'を拾った。');turnEnd();}
function nameOf(it){return displayName(it)}
function displayName(it){const d=itemDefs[it.id];if(it.id==='herb'&&it.identified)return it.actual==='poison'?'毒草':'薬草';if(it.id==='scroll'&&it.identified)return ({identify:'識別の巻物',map:'あかりの巻物',sleep:'眠りの巻物'})[it.actual]||'巻物';return d.name;}
function iconOf(id){return itemDefs[id].icon}
function selectItem(i){const it=s.bag[i];if(!it)return;const d=itemDefs[it.id];const unknown=d.unknown&&!it.identified;let desc=unknown?'用途不明。使ってみるか、巻物などで正体を調べよう。':d.desc;
let buttons='';
if(['grass','scroll','food','heal','poison','escape','jar'].includes(d.kind))buttons+='<button data-act="use">使う</button>';
if(d.kind==='staff')buttons+='<button data-act="staff">振る（正面）</button>';
if(d.kind==='weapon'||d.kind==='shield'||d.kind==='bracelet')buttons+='<button data-act="equip">'+((s.weapon===it||s.shield===it||s.bracelet===it)?'装備中':'装備する')+'</button>';
if(d.kind==='staff'&&it.charges==null)it.charges=d.charges||3;
if(d.kind==='staff')desc+=' 残り回数：'+it.charges+'。';
buttons+='<button data-act="throw">投げる</button><button data-act="drop">足元に置く</button><button data-act="discard">捨てる</button>';
if(unknown)buttons+='<button data-act="inspect">観察する</button>';
buttons+='<button data-act="close">閉じる</button>';
popModal('<h2>アイテム</h2><div class="itembig"><div class="bigico">'+d.icon+'</div><div><strong>'+displayName(it)+(s.weapon===it||s.shield===it?' <span style="color:#f4d17c">装備中</span>':'')+'</strong><small>'+desc+'</small><small>売却価値の目安：'+d.value+' G</small></div></div><div class="modalactions">'+buttons+'</div><div class="notice">※行動を伴う操作では敵も1ターン行動します。</div>');
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='close'){closeModal();return}closeModal();if(a==='use'){if(d.jarEffect==='change')chooseChangeTarget(i);else useItem(i)}if(a==='staff')useStaff(i);if(a==='equip')equipItem(i);if(a==='throw')throwItem(i);if(a==='drop')dropItem(i);if(a==='discard')discardItem(i);if(a==='inspect')inspectItem(i)})}
function chooseChangeTarget(jarIndex){const jar=s.bag[jarIndex];if(!jar)return;const targets=s.bag.filter(q=>q!==jar);if(!targets.length){say('変化させる道具がない。');removeItem(jarIndex);turnEnd();render();return}let html='<h2>変化させる道具を選ぶ</h2><p>選んだ道具が別の道具に変わります。</p><div class="fullitems">';for(const target of targets){const d=itemDefs[target.id];html+='<button class="choice" data-change-target="'+target.uid+'"><span>'+d.icon+'</span><span><strong>'+displayName(target)+'</strong><small>'+d.desc+'</small></span></button>'}html+='</div><button id="changeCancel" style="width:100%;margin-top:8px">やめる</button>';popModal(html);document.querySelectorAll('[data-change-target]').forEach(b=>b.onclick=()=>{closeModal();changeJarTarget(jar.uid,Number(b.dataset.changeTarget))});document.getElementById('changeCancel').onclick=()=>{closeModal()}}
function changeJarTarget(jarUid,targetUid){const jar=s.bag.find(q=>q.uid===jarUid),target=s.bag.find(q=>q.uid===targetUid);if(!jar||!target||jar===target)return;const candidates=Object.keys(itemDefs).filter(id=>itemDefs[id].kind!=='weapon'&&itemDefs[id].kind!=='shield'&&itemDefs[id].kind!=='bracelet'&&id!==jar.id&&id!==target.id);if(!candidates.length)return;if(s.weapon===target)s.weapon=null;if(s.shield===target)s.shield=null;if(s.bracelet===target)s.bracelet=null;const id=candidates[Math.floor(Math.random()*candidates.length)];target.id=id;delete target.actual;delete target.charges;target.identified=false;say(displayName(target)+'が別の道具に変わった！');removeItem(s.bag.indexOf(jar));turnEnd();render()}
function useItem(i){const it=s.bag[i];if(!it)return;const d=itemDefs[it.id];if(d.unknown&&!it.identified){it.identified=true;s.found.add(it.id);say('正体が分かった。 '+displayName(it));}const effect=it.actual||d.effect||d.jarEffect||it.id;
if(effect==='heal'||effect==='herb'||effect==='potion'||effect==='healJar'){const amount=effect==='potion'?6:effect==='healJar'?Math.ceil(s.maxHp/2):5,before=s.hp;s.hp=Math.min(s.maxHp,s.hp+amount);say('HPが'+(s.hp-before)+'回復した。');removeItem(i)}
else if(effect==='poison'){if(s.bracelet&&itemDefs[s.bracelet.id].braceletEffect==='poison')say('毒消しの腕輪が毒を打ち消した。');else{s.hp-=3;say('毒草だった！ HPが3減った。')}removeItem(i)}
else if(effect==='identify'||effect==='identifyJar'){let n=0;for(const target of s.bag){if(target!==it&&itemDefs[target.id].unknown&&!target.identified&&n<(effect==='identifyJar'?2:1)){target.identified=true;n++;}}say(n?'道具を'+n+'つ識別した。':'識別できる道具がない。');removeItem(i)}
else if(effect==='eye'){for(const t of s.traps)t.revealed=true;for(const e of s.enemies)if(e.invisible)e.revealed=true;say('目薬草の効果で罠と隠れていた敵が見えるようになった。');removeItem(i)}
else if(effect==='map'||effect==='mapJar'){for(let y=0;y<N;y++)for(let x=0;x<N;x++)s.seen.add(x+','+y);say('フロア全体が明らかになった！');removeItem(i)}
else if(effect==='sleep'||effect==='sleepAll'||effect==='sleepJar'){const list=effect==='sleep'?s.enemies.slice().sort((a,b)=>Math.max(Math.abs(a.x-s.x),Math.abs(a.y-s.y))-Math.max(Math.abs(b.x-s.x),Math.abs(b.y-s.y))).slice(0,1):s.enemies;for(const e of list)e.sleep=Math.max(e.sleep||0,effect==='sleep'?4:effect==='sleepJar'?2:3);say(effect==='sleep'?'最も近い敵が眠りについた。':'フロアの敵が眠りについた！');removeItem(i)}
else if(effect==='seed'||d.foodGain){const gain=d.foodGain||(effect==='seed'?25:0),before=s.food;s.food=Math.min(100,s.food+gain);if(it.id==='staleRice')s.hp=Math.max(1,s.hp-2);say('満腹度が'+(s.food-before)+'回復した。');removeItem(i)}
else if(effect==='strength'||effect==='power'){s.powerTurns=Math.max(s.powerTurns,10);say('力がみなぎる！ 10ターン攻撃力+2。');removeItem(i)}
else if(effect==='quick'){s.quickTurns=Math.max(s.quickTurns,3);say('身のこなしが軽くなった。3ターン敵の行動を一度おきに無効化する。');removeItem(i)}
else if(effect==='confuse'){for(const e of s.enemies)e.sleep=Math.max(e.sleep||0,3);say('敵の動きが乱れ、3ターン行動できなくなった。');removeItem(i)}
else if(effect==='jump'){let spots=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(!blocked(x,y)&&!s.enemies.some(e=>e.x===x&&e.y===y)&&!s.items.some(q=>q.x===x&&q.y===y)&&Math.max(Math.abs(x-s.x),Math.abs(y-s.y))>4)spots.push([x,y]);if(spots.length){const p=spots[Math.floor(Math.random()*spots.length)];s.x=p[0];s.y=p[1];say('高飛び草で別の場所へ移動した！')}removeItem(i)}

else if(effect==='weak'){const e=frontEnemy();if(e){e.atk=Math.max(1,e.atk-2);e.hp-=2;say('正面の敵を弱らせた。')}else say('正面に敵がいない。草は消費された。');removeItem(i)}
else if(effect==='blast'||effect==='blastLocal'){const targets=effect==='blastLocal'?s.enemies.filter(e=>Math.max(Math.abs(e.x-s.x),Math.abs(e.y-s.y))<=1):s.enemies;for(const e of [...targets]){e.hp-=effect==='blastLocal'?10:5;if(e.hp<=0)defeatEnemy(e)}say(effect==='blastLocal'?'火炎が隣接する敵を包んだ！':'爆発がフロア全体を駆け巡った！');removeItem(i)}

function stopMoveHold(b){const h=moveHolds.get(b);if(!h)return;clearTimeout(h.start);clearInterval(h.repeat);moveHolds.delete(b)}
document.querySelectorAll('[data-move]').forEach(b=>{
  b.style.touchAction='none';
  b.addEventListener('pointerdown',e=>{
    if(s.over)return;e.preventDefault();stopMoveHold(b);if(b.setPointerCapture&&e.pointerId!==undefined){try{b.setPointerCapture(e.pointerId)}catch(_){}}
    const [dx,dy]=b.dataset.move.split(',').map(Number);doMove(dx,dy);
    const h={start:null,repeat:null};moveHolds.set(b,h);
    h.start=setTimeout(()=>{
      if(!moveHolds.has(b))return;
      h.repeat=setInterval(()=>{
        if(s.over){stopMoveHold(b);return}
        const oldX=s.x,oldY=s.y,wasTurn=s.turn;
        const trapBefore=s.traps.filter(t=>t.triggered).length;
        const nx=s.x+dx,ny=s.y+dy;
        // Stop at enemies/walls/traps instead of repeatedly spending turns there.
        const blockedByEnemy=s.enemies.some(q=>q.x===nx&&q.y===ny);
        if(!canStep(s.x,s.y,dx,dy)||blockedByEnemy){stopMoveHold(b);return}
        doMove(dx,dy);
        const trapAfter=s.traps.filter(t=>t.triggered).length;
        if(s.over||s.x===oldX&&s.y===oldY||trapAfter>trapBefore||s.turn===wasTurn)stopMoveHold(b);
      },160);
    },500);
  });
  ['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>stopMoveHold(b)));
});
document.getElementById('logHistoryButton').onclick=()=>{const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');let html='<h2>ログ履歴</h2><p>この探索で起きた出来事（最新300件）</p><div class="fullitems" style="max-height:55vh;overflow:auto">';if(!logHistory.length)html+='<p>履歴はありません。</p>';else for(const msg of logHistory.slice().reverse())html+='<div class="choice" style="padding:7px 9px;cursor:default"><span style="font-size:13px;width:auto;text-align:left">› '+esc(msg)+'</span></div>';html+='</div><button id="logHistoryClose" style="width:100%;margin-top:10px">閉じる</button>';popModal(html);document.getElementById('logHistoryClose').onclick=closeModal};
document.getElementById('pickup').onclick=()=>{const panel=document.getElementById('bagpanel');const open=panel.classList.toggle('inventory-open');document.getElementById('pickup').textContent=open?'B 持ち物を閉じる':'B 持ち物';};document.getElementById('closeBag').onclick=()=>{document.getElementById('bagpanel').classList.remove('inventory-open');document.getElementById('pickup').textContent='B 持ち物';};document.getElementById('groundPickup').onclick=openPickup;document.getElementById('attack').onclick=()=>{if(s.over)return;let e=frontEnemy();if(!e){const adjacent=s.enemies.filter(q=>Math.max(Math.abs(q.x-s.x),Math.abs(q.y-s.y))===1);adjacent.sort((a,b)=>{const score=q=>{const dx=q.x-s.x,dy=q.y-s.y;return dx*s.front[0]+dy*s.front[1]};return score(b)-score(a)});e=adjacent[0];if(e){s.front=[Math.sign(e.x-s.x),Math.sign(e.y-s.y)];say('隣接する敵に向き直って攻撃。')}}if(e)attackEnemy(e);else say('攻撃できる敵がいない。');turnEnd()};
document.getElementById('escape').onclick=escape;document.getElementById('descend').onclick=descend;document.getElementById('wait').onclick=waitTurn;
document.getElementById('faceEnemy').onclick=()=>{turnToEnemy();render()};
document.getElementById('showMap').onclick=showMap;document.getElementById('catalog').onclick=()=>{const groups=[['武器','weapon'],['盾','shield'],['草・種','grass'],['巻物','scroll'],['杖','staff'],['腕輪','bracelet'],['壺','jar'],['食料','food'],['投擲道具','throw'],['回復薬','heal'],['帰還道具','escape'],['遺物','treasure']];let html='<h2>道具図鑑</h2><p>全カテゴリの道具一覧。効果は試作版の設定。</p>';for(const [title,kind] of groups){const entries=Object.entries(itemDefs).filter(([id,d])=>d.kind===kind);html+='<h3 style="margin:12px 0 4px;color:#f4d58c">'+title+'（'+entries.length+'種）</h3><div class="fullitems">';for(const [id,d] of entries)html+='<div class="choice"><span>'+d.icon+'</span><span><strong>'+d.name+'</strong><small>'+d.desc+'</small></span></div>';html+='</div>';}html+='<button id="catalogClose" style="width:100%;margin-top:10px">閉じる</button>';popModal(html);document.getElementById('catalogClose').onclick=closeModal};
document.addEventListener('click',e=>{if(e.target.id==='mapClose')closeModal()});
function openShop(){if(s.over){say('探索中のみ交換できます。');return}if(s.x!==2||s.y!==2){popModal('<h2>拠点交換</h2><p>出発地点（左上の開始部屋）に戻ると利用できます。</p><button id="shopClose" style="width:100%">閉じる</button>');document.getElementById('shopClose').onclick=closeModal;return}const stock=[['potion','回復薬','20G'],['shield','木の盾','35G'],['sword','錆びた剣','45G'],['escape','帰還の巻物','25G']];let html='<h2>拠点交換</h2><p>所持金：'+s.gold+'G。持ち物に空きが必要です。</p><div class="fullitems">';for(const [id,nm,cost] of stock)html+='<button class="choice" data-buy="'+id+'"><span>'+itemDefs[id].icon+'</span><span><strong>'+nm+'</strong><small>'+cost+'</small></span></button>';html+='</div><button id="shopClose" style="width:100%;margin-top:8px">閉じる</button>';popModal(html);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy,cost={potion:20,shield:35,sword:45,escape:25}[id];if(s.gold<cost){say('所持金が足りない。');return}if(s.bag.length>=CAP){say('持ち物がいっぱい。');return}s.gold-=cost;s.bag.push(makeItem(0,0,id,{identified:true}));say(itemDefs[id].name+'を'+cost+'Gで交換した。');openShop();render()});document.getElementById('shopClose').onclick=closeModal}
document.getElementById('restart').onclick=()=>{closeModal();document.getElementById('endwrap').style.display='none';fresh()};
document.getElementById('continue').onclick=()=>{document.getElementById('endwrap').style.display='none';fresh({gold:s.gold,escapes:s.escapes,secured:s.secured,found:s.found,best:s.best})};
window.addEventListener('keydown',e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],q:[-1,-1],e:[1,-1],z:[-1,1],c:[1,1]};if(m[e.key]){e.preventDefault();doMove(...m[e.key])}});
// HUDはマップの外、持ち物はボタン操作時だけ表示。キャラクターを覆わない。
fresh();
})();
</script></body></html>
