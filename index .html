<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNKNOWN DUNGEON</title>
<style>
:root{--ink:#e9e3ce;--muted:#9ca6a5;--gold:#ffd16c;--panel:#171d24;--edge:#4d5b62;--red:#ed6c63;--green:#8bd6a2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1015;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
body{background:radial-gradient(ellipse at top,#25313b 0,#10171e 48%,#080c11 100%);padding:12px}
.game{max-width:1000px;margin:0 auto;display:grid;gap:10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 3px}
.brand{font-weight:900;letter-spacing:.12em;font-size:clamp(17px,3vw,25px);color:#f3d58c;text-shadow:2px 2px #583f2b}
.brand small{display:block;color:#8faaa9;font-size:10px;letter-spacing:.24em;font-weight:700;text-shadow:none}
button{font:inherit;color:var(--ink);background:linear-gradient(#394853,#222e37);border:1px solid #65737b;border-bottom-width:3px;border-radius:7px;padding:10px 13px;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px);border-bottom-width:1px;filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:default}
.topbar button{font-size:12px;padding:8px 10px}
.hud{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:7px}
.hudbox{border:1px solid #394750;background:linear-gradient(180deg,#222d35,#151c22);border-radius:8px;padding:8px 10px;box-shadow:inset 0 1px #ffffff0b}
.hudlabel{font-size:10px;color:#a8b7b8;letter-spacing:.12em;font-weight:800}
.hudvalue{font-size:16px;font-weight:900;margin-top:3px}
.bar{height:7px;background:#080c10;border:1px solid #445057;border-radius:3px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a6383f,#f17c63);transition:width .2s}
.stage{position:relative;border:2px solid #52616a;border-radius:10px;overflow:hidden;background:#0a1014;box-shadow:0 10px 30px #0009,inset 0 0 0 3px #0b1117}
.stagehead{position:absolute;z-index:2;top:8px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:1px 2px #000}
.floorname{font-size:12px;font-weight:900;letter-spacing:.12em;background:#101820d9;border:1px solid #718087;padding:5px 8px;border-radius:5px}
.objective{font-size:11px;text-align:right;background:#101820d9;border:1px solid #52616a;padding:5px 8px;border-radius:5px;max-width:58%}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.floatmsg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(20px,5vw,35px);letter-spacing:.05em;color:#ffe79c;text-shadow:3px 3px #6e371e,-1px -1px #fff;opacity:0;pointer-events:none;white-space:nowrap}
.floatmsg.show{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-85%) scale(1)}}
.below{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(230px,.75fr);gap:10px}
.panel{background:linear-gradient(180deg,#1b242c,#121920);border:1px solid #3c4b54;border-radius:9px;padding:11px;min-width:0}
.paneltitle{font-size:11px;color:#b5c5c3;letter-spacing:.15em;font-weight:900;margin-bottom:8px}
.controlsrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dpad{display:grid;grid-template-columns:repeat(3,47px);grid-template-rows:repeat(2,43px);gap:4px;flex-shrink:0}
.dpad button{padding:0;font-size:20px;font-weight:900;border-radius:7px}
.dpad .blank{visibility:hidden}
.actionbuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.actionbuttons button{font-size:12px;font-weight:800;padding:10px 6px}
.actionbuttons .primary{background:linear-gradient(#826238,#50391f);border-color:#c29a58;color:#fff0c2}
.actionbuttons .danger{background:linear-gradient(#713f40,#3d262b);border-color:#a56566}
.bag{display:flex;gap:7px;flex-wrap:wrap;min-height:45px}
.slot{width:44px;height:44px;border:1px solid #53646c;background:#0d141a;border-radius:6px;display:grid;place-items:center;position:relative;font-size:23px;box-shadow:inset 0 0 8px #0008}
.slot .count{position:absolute;right:3px;bottom:0;font-size:9px;color:#fff;background:#111b;padding:0 3px}
.slot.empty{font-size:10px;color:#5d6a70;border-style:dashed}
.itemtext{font-size:12px;color:#c6d0cb;margin-top:7px;min-height:18px}
.log{height:70px;overflow:auto;font-size:11px;line-height:1.55;color:#aebdbb;display:flex;flex-direction:column-reverse;gap:2px}
.log div:first-child{color:#f1d68e}
.footerhint{color:#839493;font-size:10px;text-align:center;letter-spacing:.04em;padding:1px}
.overlay{position:fixed;inset:0;z-index:10;background:#03070be8;display:none;place-items:center;padding:20px}
.modal{width:min(420px,100%);border:2px solid #8b9a99;border-radius:12px;background:linear-gradient(#293741,#111920);padding:23px;text-align:center;box-shadow:0 20px 70px #000}
.modal .sigil{font-size:42px}.modal h2{margin:6px 0 8px;color:#ffdc88;font-size:25px}.modal p{color:#c0cbc8;font-size:13px;line-height:1.7}.modal button{margin-top:12px;min-width:150px}
@media(max-width:640px){body{padding:7px}.game{gap:7px}.hud{gap:4px}.hudbox{padding:6px}.hudlabel{font-size:9px}.hudvalue{font-size:14px}.below{grid-template-columns:1fr}.controlsrow{align-items:center}.dpad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,40px)}.panel{padding:9px}.stagehead{top:5px;left:5px;right:5px}.floorname,.objective{font-size:9px;padding:4px 5px}.log{height:52px}.bag{min-height:42px}}
</style>
</head>
<body>
<div class="game">
  <header class="topbar"><div class="brand">UNKNOWN DUNGEON<small>FIELD TEST 01 · RELIC HUNT</small></div><button id="restart">↻ やり直す</button></header>
  <section class="hud">
    <div class="hudbox"><div class="hudlabel">LIFE / HP</div><div class="hudvalue" id="hptext">12 / 12</div><div class="bar"><i id="hpbar"></i></div></div>
    <div class="hudbox"><div class="hudlabel">DEPTH</div><div class="hudvalue" id="depthtext">B1F</div></div>
    <div class="hudbox"><div class="hudlabel">BAG / 5</div><div class="hudvalue" id="bagtext">0 / 5</div></div>
    <div class="hudbox"><div class="hudlabel">BANKED GOLD</div><div class="hudvalue" id="goldtext">0 G</div></div>
  </section>
  <section class="stage">
    <div class="stagehead"><div class="floorname" id="floorname">THE OLD RUINS · B1F</div><div class="objective" id="objective">宝を集めて、入口まで帰還せよ</div></div>
    <canvas id="game" width="440" height="440" aria-label="ドット絵ダンジョン"></canvas>
    <div class="floatmsg" id="floatmsg">TREASURE!</div>
  </section>
  <div class="below">
    <section class="panel">
      <div class="paneltitle">COMMAND / 操作</div>
      <div class="controlsrow">
        <div class="dpad">
          <span class="blank"></span><button data-move="0,-1" aria-label="上">▲</button><span class="blank"></span>
          <button data-move="-1,0" aria-label="左">◀</button><button data-move="0,1" aria-label="下">▼</button><button data-move="1,0" aria-label="右">▶</button>
        </div>
        <div class="actionbuttons">
          <button id="potion">✚ 回復薬</button><button id="escape" class="danger">↩ 帰還</button>
          <button id="descend" class="primary" style="grid-column:span 2">▼ 深層へ進む</button>
        </div>
      </div>
      <div class="footerhint" style="margin-top:8px">キーボード：矢印キー / WASD　・　敵にぶつかると攻撃</div>
    </section>
    <section class="panel">
      <div class="paneltitle">RELIC POUCH / 戦利品</div>
      <div class="bag" id="bag"></div><div class="itemtext" id="bagvalue">戦利品を拾おう。持ち帰るまで未確保。</div>
      <div class="paneltitle" style="margin-top:12px">FIELD LOG / 探索ログ</div><div class="log" id="log"></div>
    </section>
  </div>
</div>
<div class="overlay" id="overlay"><div class="modal"><div class="sigil" id="endicon">✦</div><h2 id="endtitle">帰還成功</h2><p id="endtext"></p><button id="continue">拠点から再出発</button></div></div>
<script>
(()=>{
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const N=11,T=40,MAX=5;
const items={
 herb:{name:'薬草',icon:'🌿',value:8,color:'#78b95c',rarity:0},
 potion:{name:'回復薬',icon:'🧪',value:18,color:'#4baac4',rarity:0},
 coin:{name:'古びた銅貨',icon:'🪙',value:12,color:'#d4a64c',rarity:0},
 ore:{name:'青晶石',icon:'💎',value:24,color:'#6bb9d4',rarity:1},
 charm:{name:'欠けた護符',icon:'🔹',value:30,color:'#8e91e4',rarity:1},
 relic:{name:'星読みの小片',icon:'✦',value:65,color:'#f2d275',rarity:2}
};
let s;
function init(keep={}){
s={x:1,y:1,hp:12,maxHp:12,depth:1,turn:0,bag:[],gold:keep.gold||0,escapes:keep.escapes||0,found:keep.found||new Set(),secured:keep.secured||0,best:keep.best||1,seen:new Set(),tiles:[],enemies:[],loot:[],over:false,flash:0,hasPotion:true};
build();say('迷宮へ侵入。足音が暗闇に響く……');render();
}
function build(){
s.tiles=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>(x===0||y===0||x===N-1||y===N-1)?1:0));
const walls=[[3,1],[3,2],[3,3],[3,4],[6,2],[7,2],[8,2],[6,3],[6,4],[2,6],[3,6],[4,6],[7,6],[7,7],[7,8],[4,8],[5,8]];
walls.forEach(([x,y])=>s.tiles[y][x]=1);
// carve some connectors so the map is navigable
[[3,5],[5,6],[7,5],[6,8],[8,8]].forEach(([x,y])=>s.tiles[y][x]=0);
s.tiles[1][1]=0;s.tiles[9][9]=0;
s.x=1;s.y=1;s.enemies=[];s.loot=[];s.seen=new Set();
const es=s.depth===1?[[5,3,'rat'],[8,5,'bat'],[5,9,'rat']]:[[5,3,'rat'],[8,5,'bat'],[5,9,'rat'],[9,7,'bat']];
es.forEach(([x,y,type])=>{if(!s.tiles[y][x])s.enemies.push({x,y,hp:s.depth>=3?6:4,atk:s.depth>=3?3:2,type,alive:true})});
const pool=s.depth===1?['herb','coin','ore','potion','charm']:s.depth<4?['herb','coin','ore','charm','potion','relic']:['charm','ore','relic','potion'];
[[2,2],[5,1],[8,3],[2,8],[9,5],[5,7]].forEach(([x,y])=>{if(!s.tiles[y][x]&&!s.enemies.some(e=>e.x===x&&e.y===y))s.loot.push({x,y,id:pool[Math.floor(Math.random()*pool.length)]})});
s.best=Math.max(s.best,s.depth);
}
function say(text){const el=document.getElementById('log'),d=document.createElement('div');d.textContent='› '+text;el.prepend(d);while(el.children.length>12)el.lastChild.remove()}
function popup(text){const e=document.getElementById('floatmsg');e.textContent=text;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function reveal(){for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(Math.abs(x)+Math.abs(y)<=4&&s.x+x>=0&&s.y+y>=0&&s.x+x<N&&s.y+y<N)s.seen.add((s.x+x)+','+(s.y+y))}
function blocked(x,y){return x<0||y<0||x>=N||y>=N||s.tiles[y][x]===1}
function move(dx,dy){
if(s.over)return;let nx=s.x+dx,ny=s.y+dy;if(blocked(nx,ny)){say('壁に阻まれた。');return}
let e=s.enemies.find(e=>e.x===nx&&e.y===ny);
if(e){e.hp-=3;popup('SLASH!');say('攻撃！ 敵に3ダメージ');if(e.hp<=0){s.enemies=s.enemies.filter(q=>q!==e);say('敵を撃破！');if(Math.random()<.6){const id=['coin','herb','ore','charm'][Math.floor(Math.random()*4)];s.loot.push({x:e.x,y:e.y,id});say('敵が何かを落とした！')}}else{s.hp-=e.atk;say('反撃を受けた！ HP -'+e.atk)}}
else{s.x=nx;s.y=ny;s.turn++;pickUp();if(s.x===1&&s.y===1&&s.bag.length){}}
enemyTurn();reveal();if(s.hp<=0)fail();render();
}
function pickUp(){const i=s.loot.findIndex(l=>l.x===s.x&&l.y===s.y);if(i<0)return;const l=s.loot[i],it=items[l.id];if(s.bag.length>=MAX){say('ポーチがいっぱいだ。何かを諦める必要がある。');return}s.bag.push(l.id);s.loot.splice(i,1);s.found.add(l.id);popup(it.rarity===2?'RARE RELIC!':'FOUND!');say(it.name+'を発見！ 持ち帰り価値 '+it.value+'G');}
function enemyTurn(){if(s.over)return;for(const e of s.enemies){let d=Math.abs(e.x-s.x)+Math.abs(e.y-s.y);if(d===1){s.hp-=e.atk;say((e.type==='bat'?'コウモリ':'迷宮ネズミ')+'の攻撃！ HP -'+e.atk);continue}if(d<=5){let moves=[[Math.sign(s.x-e.x),0],[0,Math.sign(s.y-e.y)]].filter(a=>a[0]||a[1]);for(const [dx,dy] of moves){let x=e.x+dx,y=e.y+dy;if(!blocked(x,y)&&!s.enemies.some(q=>q!==e&&q.x===x&&q.y===y)&&!(x===s.x&&y===s.y)){e.x=x;e.y=y;break}}}}}
function potion(){if(s.over)return;let i=s.bag.findIndex(id=>items[id].rarity===0&&(id==='herb'||id==='potion'));let amount=5;if(i>=0){const id=s.bag.splice(i,1)[0];amount=items[id].name==='薬草'?4:8;say(items[id].name+'を使用。')}else if(s.hasPotion){s.hasPotion=false;say('持ち込み回復薬を使用。')}else{say('回復手段がない！');return}const old=s.hp;s.hp=Math.min(s.maxHp,s.hp+amount);popup('+'+(s.hp-old)+' HP');enemyTurn();if(s.hp<=0)fail();render()}
function descend(){if(s.over)return;if(s.x!==9||s.y!==9){say('階段は右下の紫色の床にある。');return}s.depth++;build();popup('B'+s.depth+'F');say(s.depth+'層へ進んだ。空気が冷たくなる……');render()}
function escape(){if(s.over)return;if(s.x!==1||s.y!==1){say('帰還口は左上。そこまで戻ろう。');popup('FIND THE EXIT');return}const val=s.bag.reduce((a,id)=>a+items[id].value,0);s.gold+=val;s.secured+=s.bag.length;s.escapes++;s.bag=[];s.over=true;say('帰還成功！ '+val+'Gを確保');showEnd('✦','帰還成功！','戦利品を無事に持ち帰った。\\n獲得 '+val+' G。今回の発見は記録に残った。');render()}
function fail(){if(s.over)return;s.hp=0;s.bag=[];s.over=true;say('力尽きた……戦利品を失った。');showEnd('☠','力尽きた','今回の戦利品はすべて失われた。発見記録と、過去に持ち帰った資金は残る。');render()}
function showEnd(icon,title,text){document.getElementById('endicon').textContent=icon;document.getElementById('endtitle').textContent=title;document.getElementById('endtext').textContent=text.replace(/\\n/g,' ');document.getElementById('overlay').style.display='grid'}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function tile(x,y){
const px=x*T,py=y*T;let hash=(x*73+y*191+x*y*13)%17;
if(!s.seen.has(x+','+y)){rect(px,py,T,T,'#080d12');rect(px+2,py+2,T-4,T-4,'#0a1016');return}
if(s.tiles[y][x]){rect(px,py,T,T,'#26343b');rect(px+1,py+1,T-2,T-2,'#33434a');rect(px+2,py+2,T-4,3,'#4b5b5f');rect(px+2,py+7,T-4,2,'#1a272f');if(hash%3===0)rect(px+7,py+13,3,4,'#59666a');rect(px,py+T-3,T,3,'#111b22')}
else{rect(px,py,T,T,'#4b4b3c');rect(px+1,py+1,T-2,T-2,hash%4===0?'#62614a':'#565744');rect(px+2,py+3,T-4,1,'#72715a');rect(px+3,py+11,3,2,'#454a3d');rect(px+20,py+25,5,2,'#484b3e');if(hash%5===0)rect(px+28,py+8,2,3,'#777257');rect(px,py+T-3,T,3,'#343b34')}
}
function drawHero(x,y){
const px=x*T,py=y*T;
rect(px+10,py+30,21,5,'#25221d');
rect(px+14,py+25,5,7,'#6e3e2c');rect(px+23,py+25,5,7,'#6e3e2c');
rect(px+12,py+15,18,13,'#3d7b65');rect(px+10,py+17,5,9,'#bd8d4c');rect(px+27,py+17,5,9,'#bd8d4c');
rect(px+13,py+7,17,12,'#d6a36d');rect(px+11,py+4,21,7,'#573d2a');rect(px+13,py+1,15,5,'#795237');rect(px+14,py+10,3,3,'#2a2522');rect(px+24,py+10,3,3,'#2a2522');rect(px+18,py+15,7,2,'#f0d5a3');
rect(px+30,py+15,3,14,'#c4c7bc');rect(px+29,py+13,5,4,'#e4d9b4');
}
function drawEnemy(e){
const x=e.x*T,y=e.y*T;rect(x+10,y+30,21,4,'#25221c');
if(e.type==='bat'){rect(x+4,y+13,12,9,'#59496e');rect(x+25,y+13,12,9,'#59496e');rect(x+11,y+10,18,16,'#77638c');rect(x+14,y+7,5,5,'#b5a0c8');rect(x+23,y+7,5,5,'#b5a0c8');rect(x+14,y+15,4,4,'#f2d879');rect(x+23,y+15,4,4,'#f2d879')}
else{rect(x+9,y+14,23,14,'#786b56');rect(x+11,y+9,18,13,'#9c8b6c');rect(x+12,y+5,5,7,'#b4a182');rect(x+24,y+5,5,7,'#b4a182');rect(x+14,y+14,4,4,'#e96b57');rect(x+24,y+14,4,4,'#e96b57');rect(x+16,y+24,5,7,'#5a4b3e');rect(x+25,y+24,5,7,'#5a4b3e')}
}
function drawLoot(l){
const x=l.x*T,y=l.y*T,it=items[l.id];rect(x+10,y+28,21,4,'#24231b');
if(l.id==='coin'){rect(x+13,y+13,15,15,'#986b2f');rect(x+15,y+11,13,14,'#e7bd56');rect(x+19,y+14,5,8,'#f8e59b')}
else if(l.id==='herb'){rect(x+18,y+18,4,13,'#5c9a4b');rect(x+9,y+14,13,7,'#82c96b');rect(x+20,y+10,12,7,'#9bdd73');rect(x+18,y+18,11,6,'#6eb45a')}
else if(l.id==='potion'){rect(x+17,y+8,9,5,'#d7c5a0');rect(x+15,y+12,13,18,'#55b5d2');rect(x+17,y+16,9,9,'#8de6ed');rect(x+17,y+23,9,5,'#3285a6')}
else if(l.id==='ore'){rect(x+12,y+18,16,13,'#387c9a');rect(x+15,y+10,13,15,'#7de0eb');rect(x+18,y+12,5,9,'#d6fbf5')}
else if(l.id==='charm'){rect(x+14,y+10,13,20,'#595ba5');rect(x+17,y+8,8,20,'#b6a9f5');rect(x+18,y+13,6,10,'#e4ddff')}
else{rect(x+12,y+13,17,17,'#947b40');rect(x+15,y+8,12,20,'#f4d77c');rect(x+19,y+13,4,10,'#fff2b1');rect(x+8,y+18,7,5,'#f6df91')}
if(it.rarity>=1){ctx.strokeStyle=it.color;ctx.lineWidth=1;ctx.strokeRect(x+7,y+6,26,27)}
}
function render(){
reveal();ctx.clearRect(0,0,cv.width,cv.height);
for(let y=0;y<N;y++)for(let x=0;x<N;x++)tile(x,y);
// torch-like local glow
const g=ctx.createRadialGradient(s.x*T+20,s.y*T+20,18,s.x*T+20,s.y*T+20,190);g.addColorStop(0,'#ffd78510');g.addColorStop(1,'#00000082');ctx.fillStyle=g;ctx.fillRect(0,0,440,440);
for(const l of s.loot)if(s.seen.has(l.x+','+l.y))drawLoot(l);
for(const e of s.enemies)if(s.seen.has(e.x+','+e.y))drawEnemy(e);
if(s.seen.has('1,1')){rect(1*T+10,1*T+10,20,20,'#8b633a');rect(1*T+13,1*T+13,14,14,'#d2aa63');rect(1*T+17,1*T+16,5,9,'#60472b')}
if(s.seen.has('9,9')){rect(9*T+8,9*T+8,24,24,'#57467a');rect(9*T+12,9*T+12,16,16,'#a895d7');rect(9*T+16,9*T+16,8,8,'#d7c6ff')}
drawHero(s.x,s.y);
document.getElementById('hptext').textContent=s.hp+' / '+s.maxHp;document.getElementById('hpbar').style.width=(s.hp/s.maxHp*100)+'%';
document.getElementById('depthtext').textContent='B'+s.depth+'F';document.getElementById('bagtext').textContent=s.bag.length+' / '+MAX;document.getElementById('goldtext').textContent=s.gold+' G';
document.getElementById('floorname').textContent='THE OLD RUINS · B'+s.depth+'F';
document.getElementById('objective').textContent=s.bag.length?'戦利品 '+s.bag.reduce((a,id)=>a+items[id].value,0)+'G相当 · 入口へ帰還':'宝を探せ · 深層ほど高価な品';
const bag=document.getElementById('bag');bag.innerHTML='';
for(let i=0;i<MAX;i++){const slot=document.createElement('div');slot.className='slot'+(i>=s.bag.length?' empty':'');if(i<s.bag.length){const it=items[s.bag[i]];slot.textContent=it.icon;slot.title=it.name;const count=document.createElement('span');count.className='count';count.textContent=it.value+'G';slot.appendChild(count)}else slot.textContent='—';bag.appendChild(slot)}
document.getElementById('bagvalue').textContent=s.bag.length?'持ち帰り価値：'+s.bag.reduce((a,id)=>a+items[id].value,0)+' G ／ 脱出成功まで未確保':'戦利品を拾おう。持ち帰るまで未確保。';
document.getElementById('potion').disabled=s.over;document.getElementById('escape').disabled=s.over;document.getElementById('descend').disabled=s.over;
}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>move(...b.dataset.move.split(',').map(Number))));
document.getElementById('potion').onclick=potion;document.getElementById('escape').onclick=escape;document.getElementById('descend').onclick=descend;
document.getElementById('restart').onclick=()=>{document.getElementById('overlay').style.display='none';init()};
document.getElementById('continue').onclick=()=>{document.getElementById('overlay').style.display='none';const keep={gold:s.gold,escapes:s.escapes,found:s.found,secured:s.secured,best:s.best};init(keep);say('拠点から再出発。過去の記録は残っている。')};
window.addEventListener('keydown',e=>{const k={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(k[e.key]){e.preventDefault();move(...k[e.key])}});
init();
})();
</script>
</body>
